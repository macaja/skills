<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>explain-me reference sheet</title>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .tag { fill: #1f2328; }
    .tagtext { fill: #ffffff; font-size: 20px; font-weight: 700; text-anchor: middle; }
    .h { fill: #1f2328; font-size: 20px; font-weight: 600; }
    .t { fill: #1f2328; font-size: 15px; }
    .s { fill: #1f2328; font-size: 13px; }
    .b { font-weight: 600; }
    .muted { fill: #59636e; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .accent { fill: #1f5fbf; }
    .good { fill: #1a7f37; }
    .bad { fill: #c62828; }
    .avoid { fill: #c62828; text-decoration: line-through; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    .step { fill: #f3f7fc; stroke: #1f5fbf; stroke-width: 1.5; }
    .arrow { stroke: #1f5fbf; stroke-width: 2; fill: none; }
    .arrowhead { fill: #1f5fbf; }
    .barbg { fill: #eef2f7; }
    .bar { fill: #cfe0f5; stroke: #1f5fbf; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg, .panel { fill: #0d1117; }
      .panel { stroke: #c9d1d9; }
      .tag { fill: #e6edf3; }
      .tagtext { fill: #0d1117; }
      .h, .t, .s { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .accent { fill: #6cb6ff; }
      .good { fill: #3fb950; }
      .bad, .avoid { fill: #ff7b72; }
      .rule { stroke: #30363d; }
      .step { fill: #121d2b; stroke: #6cb6ff; }
      .arrow { stroke: #6cb6ff; }
      .arrowhead { fill: #6cb6ff; }
      .barbg { fill: #161b22; }
      .bar { fill: #1f3b5c; stroke: #6cb6ff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="1180"/>

  <!-- Title -->
  <text class="h" x="40" y="52" style="font-size:26px">explain-me · reference sheet</text>
  <text class="t muted" x="1560" y="52" text-anchor="end">Text → diagram → interactive page on claude.ai → video</text>

  <!-- A. The ladder -->
  <rect class="panel" x="40" y="90" width="520" height="400"/>
  <rect class="tag" x="40" y="90" width="40" height="40"/>
  <text class="tagtext" x="60" y="117">A</text>
  <text class="h" x="96" y="117">The ladder</text>
  <line class="rule" x1="40" y1="130" x2="560" y2="130"/>

  <text class="s muted" x="60" y="190">Climbs alone</text>
  <text class="s muted" x="60" y="208">up to rung 2.</text>
  <text class="s muted" x="60" y="226">Offers the rest.</text>

  <rect class="step" x="170" y="170" width="320" height="64" rx="4"/>
  <text class="t b" x="186" y="196">4  Video</text>
  <text class="s muted" x="186" y="219">Last. Only when the user asks.</text>

  <rect class="step" x="130" y="250" width="320" height="64" rx="4"/>
  <text class="t b" x="146" y="276">3  Interactive page</text>
  <text class="s muted" x="146" y="299">Published on claude.ai.</text>

  <rect class="step" x="90" y="330" width="320" height="64" rx="4"/>
  <text class="t b" x="106" y="356">2  Diagram</text>
  <text class="s muted" x="106" y="379">Parts that connect. Box-drawing.</text>

  <rect class="step" x="50" y="410" width="320" height="64" rx="4"/>
  <text class="t b" x="66" y="436">1  Text</text>
  <text class="s muted" x="66" y="459">Default. About 80% of ASD-STE100.</text>

  <line class="arrow" x1="515" y1="472" x2="515" y2="186"/>
  <polygon class="arrowhead" points="515,172 507,188 523,188"/>
  <text class="s accent" transform="translate(540 330) rotate(-90)" text-anchor="middle">easier to take in, costs more</text>

  <!-- B. Text at 80% -->
  <rect class="panel" x="580" y="90" width="980" height="400"/>
  <rect class="tag" x="580" y="90" width="40" height="40"/>
  <text class="tagtext" x="600" y="117">B</text>
  <text class="h" x="636" y="117">Text at about 80% of ASD-STE100</text>
  <text class="s muted mono" x="1544" y="116" text-anchor="end">keep the structure, relax the dictionary</text>
  <line class="rule" x1="580" y1="130" x2="1560" y2="130"/>

  <text class="t b good" x="610" y="165">KEEP: the structure rules</text>
  <text class="t" x="610" y="195"><tspan class="good">✓</tspan>  One topic in each paragraph, a maximum of 6 sentences.</text>
  <text class="t" x="610" y="221"><tspan class="good">✓</tspan>  A maximum of 20 words for a step, 25 for a description.</text>
  <text class="t" x="610" y="247"><tspan class="good">✓</tspan>  One instruction in each sentence.</text>
  <text class="t" x="610" y="273"><tspan class="good">✓</tspan>  Active voice. Imperative for steps.</text>
  <text class="t" x="610" y="299"><tspan class="good">✓</tspan>  Simple tenses: present, past, future.</text>
  <text class="t" x="610" y="325"><tspan class="good">✓</tspan>  One word for one thing, every time.</text>
  <text class="t" x="610" y="351"><tspan class="good">✓</tspan>  The common word over the formal one.</text>
  <text class="t" x="610" y="377"><tspan class="good">✓</tspan>  Noun clusters of 3 words or fewer.</text>
  <text class="t" x="610" y="403"><tspan class="good">✓</tspan>  Keep "the", "a" and "this". Short, not telegraphic.</text>
  <text class="t" x="610" y="429"><tspan class="good">✓</tspan>  A vertical list for a sequence or more than 3 items.</text>
  <text class="t" x="610" y="455"><tspan class="good">✓</tspan>  Warnings: the command first, then the risk.</text>

  <line class="rule" x1="1265" y1="150" x2="1265" y2="470"/>

  <text class="t b accent" x="1290" y="165">RELAX: the dictionary</text>
  <text class="s" x="1290" y="195">A technical word outside the</text>
  <text class="s" x="1290" y="214">~900 approved words is fine</text>
  <text class="s" x="1290" y="233">when no simple word says</text>
  <text class="s" x="1290" y="252">the same thing.</text>
  <text class="s" x="1290" y="290">Code names, commands and</text>
  <text class="s" x="1290" y="309">errors stay exactly as they</text>
  <text class="s" x="1290" y="328">are: they are technical names.</text>
  <text class="s b" x="1290" y="366">Why not strict?</text>
  <text class="s" x="1290" y="385">A tiny vocabulary drops facts.</text>
  <text class="s" x="1290" y="404">After you write, check that</text>
  <text class="s" x="1290" y="423">every name, number, condition</text>
  <text class="s" x="1290" y="442">and exception is still there.</text>

  <!-- C. Limits -->
  <rect class="panel" x="40" y="510" width="520" height="380"/>
  <rect class="tag" x="40" y="510" width="40" height="40"/>
  <text class="tagtext" x="60" y="537">C</text>
  <text class="h" x="96" y="537">Limits</text>
  <text class="s muted mono" x="544" y="536" text-anchor="end">maximum values</text>
  <line class="rule" x1="40" y1="550" x2="560" y2="550"/>

  <text class="t" x="60" y="584">Step (procedural) sentence</text>
  <text class="t b accent mono" x="530" y="584" text-anchor="end">20 words</text>
  <rect class="barbg" x="60" y="594" width="470" height="14"/>
  <rect class="bar" x="60" y="594" width="313" height="14"/>

  <text class="t" x="60" y="646">Descriptive sentence</text>
  <text class="t b accent mono" x="530" y="646" text-anchor="end">25 words</text>
  <rect class="barbg" x="60" y="656" width="470" height="14"/>
  <rect class="bar" x="60" y="656" width="392" height="14"/>

  <text class="t" x="60" y="708">Paragraph</text>
  <text class="t b accent mono" x="530" y="708" text-anchor="end">6 sentences</text>
  <rect class="barbg" x="60" y="718" width="470" height="14"/>
  <rect class="bar" x="60" y="718" width="282" height="14"/>

  <text class="t" x="60" y="770">Noun cluster</text>
  <text class="t b accent mono" x="530" y="770" text-anchor="end">3 words</text>
  <rect class="barbg" x="60" y="780" width="470" height="14"/>
  <rect class="bar" x="60" y="780" width="282" height="14"/>

  <text class="t" x="60" y="832">Instructions in each sentence</text>
  <text class="t b accent mono" x="530" y="832" text-anchor="end">1</text>
  <rect class="barbg" x="60" y="842" width="470" height="14"/>
  <rect class="bar" x="60" y="842" width="157" height="14"/>

  <!-- D. Verb forms -->
  <rect class="panel" x="580" y="510" width="480" height="380"/>
  <rect class="tag" x="580" y="510" width="40" height="40"/>
  <text class="tagtext" x="600" y="537">D</text>
  <text class="h" x="636" y="537">Verb forms</text>
  <line class="rule" x1="580" y1="550" x2="1060" y2="550"/>

  <text class="s muted" x="600" y="578">Form</text>
  <text class="s muted" x="790" y="578">Example</text>
  <line class="rule" x1="595" y1="588" x2="1045" y2="588"/>

  <text class="s" x="600" y="612">Command (imperative)</text>
  <text class="s mono" x="790" y="612">Close the valve.</text>
  <text class="t good" x="1040" y="612" text-anchor="end">✓</text>
  <text class="s" x="600" y="642">Simple present</text>
  <text class="s mono" x="790" y="642">The valve closes.</text>
  <text class="t good" x="1040" y="642" text-anchor="end">✓</text>
  <text class="s" x="600" y="672">Simple past</text>
  <text class="s mono" x="790" y="672">The valve closed.</text>
  <text class="t good" x="1040" y="672" text-anchor="end">✓</text>
  <text class="s" x="600" y="702">Simple future</text>
  <text class="s mono" x="790" y="702">The valve will close.</text>
  <text class="t good" x="1040" y="702" text-anchor="end">✓</text>
  <text class="s" x="600" y="732">Infinitive</text>
  <text class="s mono" x="790" y="732">Turn it to close it.</text>
  <text class="t good" x="1040" y="732" text-anchor="end">✓</text>
  <text class="s" x="600" y="762">Participle (as adjective)</text>
  <text class="s mono" x="790" y="762">The closed valve</text>
  <text class="t good" x="1040" y="762" text-anchor="end">✓</text>
  <text class="s" x="600" y="792">Progressive (-ing)</text>
  <text class="s mono" x="790" y="792">The valve is closing.</text>
  <text class="t bad" x="1040" y="792" text-anchor="end">✗</text>
  <text class="s" x="600" y="822">Perfect</text>
  <text class="s mono" x="790" y="822">The valve has closed.</text>
  <text class="t bad" x="1040" y="822" text-anchor="end">✗</text>
  <text class="s" x="600" y="852">Passive, in steps</text>
  <text class="s mono" x="790" y="852">The valve must be closed.</text>
  <text class="t bad" x="1040" y="852" text-anchor="end">✗</text>
  <text class="s muted" x="600" y="878">Use -ing only inside a name, for example "landing gear".</text>

  <!-- E. Word swaps -->
  <rect class="panel" x="1080" y="510" width="480" height="380"/>
  <rect class="tag" x="1080" y="510" width="40" height="40"/>
  <text class="tagtext" x="1100" y="537">E</text>
  <text class="h" x="1136" y="537">Common words</text>
  <line class="rule" x1="1080" y1="550" x2="1560" y2="550"/>

  <text class="s muted" x="1100" y="578">English: avoid → use</text>
  <text class="s muted" x="1300" y="578">Español: evitar → usar</text>
  <line class="rule" x1="1095" y1="588" x2="1545" y2="588"/>
  <line class="rule" x1="1285" y1="566" x2="1285" y2="840"/>

  <text class="s avoid" x="1100" y="615">commence</text>
  <text class="s b good" x="1200" y="615">start</text>
  <text class="s avoid" x="1300" y="615">dar comienzo a</text>
  <text class="s b good" x="1440" y="615">empezar</text>

  <text class="s avoid" x="1100" y="649">utilize</text>
  <text class="s b good" x="1200" y="649">use</text>
  <text class="s avoid" x="1300" y="649">utilizar</text>
  <text class="s b good" x="1440" y="649">usar</text>

  <text class="s avoid" x="1100" y="683">ensure</text>
  <text class="s b good" x="1200" y="683">make sure</text>
  <text class="s avoid" x="1300" y="683">garantizar</text>
  <text class="s b good" x="1440" y="683">asegurate de</text>

  <text class="s avoid" x="1100" y="717">prior to</text>
  <text class="s b good" x="1200" y="717">before</text>
  <text class="s avoid" x="1300" y="717">con anterioridad a</text>
  <text class="s b good" x="1440" y="717">antes de</text>

  <text class="s avoid" x="1100" y="751">approximately</text>
  <text class="s b good" x="1200" y="751">about</text>
  <text class="s avoid" x="1300" y="751">aproximadamente</text>
  <text class="s b good" x="1440" y="751">unos</text>

  <text class="s avoid" x="1100" y="785">in order to</text>
  <text class="s b good" x="1200" y="785">to</text>
  <text class="s avoid" x="1300" y="785">con el fin de</text>
  <text class="s b good" x="1440" y="785">para</text>

  <text class="s avoid" x="1100" y="819">replenish</text>
  <text class="s b good" x="1200" y="819">fill</text>
  <text class="s avoid" x="1300" y="819">reponer</text>
  <text class="s b good" x="1440" y="819">llenar</text>

  <text class="s muted" x="1100" y="870">Same thing, same word: do not swap synonyms.</text>

  <!-- F. Before / after -->
  <rect class="panel" x="40" y="910" width="1520" height="250"/>
  <rect class="tag" x="40" y="910" width="40" height="40"/>
  <text class="tagtext" x="60" y="937">F</text>
  <text class="h" x="96" y="937">Before and after</text>
  <line class="rule" x1="40" y1="950" x2="1560" y2="950"/>
  <line class="rule" x1="800" y1="965" x2="800" y2="1145"/>

  <text class="s b bad" x="60" y="980">BEFORE</text>
  <text class="t" x="60" y="1004">It is imperative that the operator ensures the hydraulic reservoir is replenished</text>
  <text class="t" x="60" y="1026">prior to commencing operation.</text>
  <text class="s b good" x="60" y="1076">AFTER</text>
  <text class="t" x="60" y="1100">Make sure that the hydraulic reservoir is full before you start the operation.</text>
  <text class="s muted mono" x="60" y="1126">13 words, limit 20. One instruction. Common words.</text>

  <text class="s b bad" x="820" y="980">BEFORE</text>
  <text class="t" x="820" y="1004">The middleware is responsible for ensuring that requests which have not been</text>
  <text class="t" x="820" y="1026">authenticated are being rejected prior to reaching the handler, utilizing the</text>
  <text class="t" x="820" y="1048">session token validation mechanism.</text>
  <text class="s b good" x="820" y="1076">AFTER</text>
  <text class="t" x="820" y="1100">The middleware rejects requests that are not authenticated. It does this before</text>
  <text class="t" x="820" y="1122">the request gets to the handler. To decide, it validates the session token.</text>
  <text class="s muted mono" x="820" y="1146">3 sentences, one idea each. Code names stay as they are.</text>
</svg>
